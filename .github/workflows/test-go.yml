name: Test GateStream Go
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 go build -buildvcs=false -o /tmp/gatestream-freebsd .
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test cloudflare/worker.test.mjs
