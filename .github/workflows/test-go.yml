name: Test GateStream Go
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - name: Test relative executable invocation
        run: |
          mkdir -p bin
          go test -c -o bin/gatestream-linux-tests .
          bin/gatestream-linux-tests -test.v -test.timeout=1m -test.run='^Test(LockRecoveryAfterSignalsAndCrash|WatchdogDuplicatePreventionAndExecRestart)$'
          rm bin/gatestream-linux-tests
      - run: go vet ./...
      - run: /bin/sh scripts/test-deployment.sh
      - name: Build release binaries
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags='-s -w' -o bin/gatestream-linux-amd64 .
          CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags='-s -w' -o bin/gatestream-freebsd-amd64 .
          (cd bin && sha256sum gatestream-linux-amd64 gatestream-freebsd-amd64 > SHA256SUMS)
          /bin/sh scripts/check-release.sh
          /bin/sh start.sh --version
      - uses: actions/upload-artifact@v4
        with:
          name: gatestream-linux-freebsd-amd64
          path: bin/
          if-no-files-found: error
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test cloudflare/worker.test.mjs
  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Cross-compile application and regression tests
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 go build -buildvcs=false -o bin/gatestream-freebsd-amd64 .
          CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 go test -c -o bin/gatestream-freebsd-tests .
      - name: Execute under FreeBSD 14.3 AMD64
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.3'
          copyback: true
          run: |
            set -u
            status=0
            /bin/sh scripts/test-freebsd.sh > freebsd-test.log 2>&1 || status=$?
            cat freebsd-test.log
            # Let the VM action copy back the log before failing the job.
            printf '%s\n' "$status" > freebsd-test.status
      - name: Check FreeBSD result
        run: |
          status=$(cat freebsd-test.status)
          exit "$status"
      - name: Upload FreeBSD test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatestream-freebsd-test-log
          path: |
            freebsd-test.log
            freebsd-test.status
          if-no-files-found: warn
